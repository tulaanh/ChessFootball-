<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cờ Vua Bóng Đá (Chess Football) – Standalone Edition</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- MQTT WebSocket CDN for Guaranteed Cross-Network Multiplayer -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- GAME ENGINE LOGIC ---
    const BOARD_WIDTH = 11;
    const BOARD_HEIGHT = 15;

    const ORTHOGONAL_VECTORS = [
      { dx: 0, dy: -1 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 1, dy: 0 }
    ];
    const DIAGONAL_VECTORS = [
      { dx: -1, dy: -1 }, { dx: 1, dy: -1 }, { dx: -1, dy: 1 }, { dx: 1, dy: 1 }
    ];
    const ALL_8_VECTORS = [...ORTHOGONAL_VECTORS, ...DIAGONAL_VECTORS];
    const KNIGHT_VECTORS = [
      { dx: 1, dy: 2 }, { dx: 2, dy: 1 }, { dx: -1, dy: 2 }, { dx: -2, dy: 1 },
      { dx: 1, dy: -2 }, { dx: 2, dy: -1 }, { dx: -1, dy: -2 }, { dx: -2, dy: -1 }
    ];

    const KNIGHT_CHIP_SHOT_VECTORS = [];
    for (let dx = -3; dx <= 3; dx++) {
      for (let dy = -3; dy <= 3; dy++) {
        if (dx === 0 && dy === 0) continue;
        if (dx * dx + dy * dy <= 10) {
          KNIGHT_CHIP_SHOT_VECTORS.push({ dx, dy });
        }
      }
    }

    const PIECE_REGISTRY = {
      king: {
        id: 'king', name: 'King', vietnameseName: 'Thủ Môn (Vua)', role: 'GK', cost: 0, symbol: '♔',
        description: 'Chốt chặn cuối cùng trong khung thành. Bước 1 ô mọi hướng, đặc biệt có thể phát bóng bổng tới bất kỳ đồng đội nào trên sân.',
        moveRule: { type: 'step', vectors: ALL_8_VECTORS.map(v => ({ ...v, maxRange: 1 })) },
        kickRule: { type: 'step', vectors: ALL_8_VECTORS.map(v => ({ ...v, maxRange: 2 })), power: 2 }
      },
      queen: {
        id: 'queen', name: 'Queen', vietnameseName: 'Nhạc Trưởng (Hậu)', role: 'FWD', cost: 45, symbol: '♕',
        description: 'Ngôi sao toàn diện nhất sân. Di chuyển trượt xa 8 hướng, sút bóng uy lực đa hướng khắp sân.',
        moveRule: { type: 'slide', vectors: ALL_8_VECTORS },
        kickRule: { type: 'slide', vectors: ALL_8_VECTORS, power: 5 }
      },
      rook: {
        id: 'rook', name: 'Rook', vietnameseName: 'Hậu Vệ Quét (Xe)', role: 'DEF', cost: 25, symbol: '♖',
        description: 'Lá chắn thép & Cỗ xe tăng. Di chuyển thẳng trượt xa không giới hạn, tung cú đại bác thẳng xuyên suốt sân.',
        moveRule: { type: 'slide', vectors: ORTHOGONAL_VECTORS },
        kickRule: { type: 'slide', vectors: ORTHOGONAL_VECTORS, power: 4 },
        hasBulldozer: true,
        specialAbilityDesc: 'Sự Trâu Bò: Khi cầm bóng đâm vào đối thủ sẽ húc văng đối thủ ra xa mà KHÔNG MẤT LƯỢT!'
      },
      bishop: {
        id: 'bishop', name: 'Bishop', vietnameseName: 'Tiền Vệ Cánh (Tượng)', role: 'MID', cost: 20, symbol: '♗',
        description: 'Chuyên gia chọc khe biên. Di chuyển trượt chéo xa không giới hạn, sút xoáy xé toang hàng phòng ngự đối phương.',
        moveRule: { type: 'slide', vectors: DIAGONAL_VECTORS },
        kickRule: { type: 'slide', vectors: DIAGONAL_VECTORS, power: 4 }
      },
      knight: {
        id: 'knight', name: 'Knight', vietnameseName: 'Tiền Đạo Lốp Bóng (Mã)', role: 'FWD', cost: 25, symbol: '♘',
        description: 'Sát thủ lốp bóng vòng cấm. Nhảy chữ L vượt qua mọi vật cản. Kỹ năng [SIÊU PHẨM LỐP BÓNG]: Sút bóng bổng hình vòm tới bất kỳ ô nào trong bán kính 3 ô mọi hướng!',
        moveRule: { type: 'leap', vectors: KNIGHT_VECTORS },
        kickRule: { type: 'leap', vectors: KNIGHT_CHIP_SHOT_VECTORS, isLob: true, power: 4 },
        specialAbilityDesc: 'Siêu Phẩm Lốp Bóng: Sút bóng bổng hình vòm vượt qua đầu mọi vật cản trong bán kính 3 ô!'
      },
      pawn: {
        id: 'pawn', name: 'Pawn', vietnameseName: 'Cầu Thủ Trẻ (Tốt)', role: 'DEF', cost: 5, symbol: '♙',
        description: 'Cầu thủ cần mẫn, di chuyển 1 ô theo 8 hướng xung quanh, chuyền ngắn 1-2 ô để phối hợp ban bật tiki-taka.',
        moveRule: { type: 'step', vectors: ALL_8_VECTORS.map(v => ({ ...v, maxRange: 1 })) },
        kickRule: { type: 'step', vectors: ALL_8_VECTORS.map(v => ({ ...v, maxRange: 2 })), power: 2 }
      },
      cannon: {
        id: 'cannon', name: 'Cannon', vietnameseName: 'Pháo Thủ (Cờ Tướng)', role: 'MID', cost: 25, symbol: '💣',
        description: 'Di chuyển thẳng trượt xa không giới hạn. Sút bóng: CẦN 1 CẦU THỦ LÀM NGÒI để nã đại bác bay qua đầu sang ô phía sau!',
        moveRule: { type: 'slide', vectors: ORTHOGONAL_VECTORS },
        kickRule: { type: 'cannon', vectors: ORTHOGONAL_VECTORS, isLob: true, power: 5 },
        specialAbilityDesc: 'Bắn Qua Ngòi: Cần đúng 1 quân làm ngòi nổ để bắn bóng vượt qua đầu!'
      }
    };

    function getPieceDefinition(typeId) {
      return PIECE_REGISTRY[typeId] || PIECE_REGISTRY['pawn'];
    }

    const INITIAL_POSITIONS_WHITE = [
      { x: 5, y: 13 }, { x: 1, y: 11 }, { x: 3, y: 11 }, { x: 7, y: 11 }, { x: 9, y: 11 },
      { x: 1, y: 9 }, { x: 4, y: 9 }, { x: 6, y: 9 }, { x: 9, y: 9 }, { x: 4, y: 8 }, { x: 6, y: 8 }
    ];

    const INITIAL_POSITIONS_BLACK = [
      { x: 5, y: 1 }, { x: 1, y: 3 }, { x: 3, y: 3 }, { x: 7, y: 3 }, { x: 9, y: 3 },
      { x: 1, y: 5 }, { x: 4, y: 5 }, { x: 6, y: 5 }, { x: 9, y: 5 }, { x: 4, y: 6 }, { x: 6, y: 6 }
    ];

    const DEFAULT_WHITE_PIECES = ['king', 'pawn', 'pawn', 'pawn', 'pawn', 'rook', 'bishop', 'bishop', 'rook', 'knight', 'queen'];
    const DEFAULT_BLACK_PIECES = ['king', 'pawn', 'pawn', 'pawn', 'pawn', 'cannon', 'bishop', 'bishop', 'rook', 'knight', 'queen'];

    function isInsideBoard(x, y) {
      if (x >= 0 && x < BOARD_WIDTH && y >= 1 && y <= 13) return true;
      if ((y === 0 || y === 14) && x >= 4 && x <= 6) return true;
      return false;
    }

    function isGoalCell(x, y, team) {
      if (team === 'white') return y === 0 && x >= 4 && x <= 6;
      return y === 14 && x >= 4 && x <= 6;
    }

    function createInitialBoard() {
      const pieces = [];
      DEFAULT_WHITE_PIECES.forEach((typeId, index) => {
        pieces.push({ id: `w_${index}_${typeId}`, typeId, team: 'white', position: { ...INITIAL_POSITIONS_WHITE[index] } });
      });
      DEFAULT_BLACK_PIECES.forEach((typeId, index) => {
        pieces.push({ id: `b_${index}_${typeId}`, typeId, team: 'black', position: { ...INITIAL_POSITIONS_BLACK[index] } });
      });

      return {
        width: BOARD_WIDTH, height: BOARD_HEIGHT,
        pieces, ballPosition: { x: 5, y: 7 },
        currentTurn: 'white', remainingAP: 2,
        score: { white: 0, black: 0 },
        selectedPieceId: null, activeAction: null,
        winner: null,
        phase: 'setup',
        commentary: [{ id: 'c_0', text: '🛠️ Giai đoạn Bố trí Đội hình & Chiến thuật. Hãy sắp xếp vị trí và chọn cầu thủ trước khi Bắt đầu!', type: 'whistle', timestamp: '00:00' }]
      };
    }

    function getPieceAt(pieces, x, y) {
      return pieces.find(p => p.position.x === x && p.position.y === y);
    }

    function isPieceAdjacentToBall(piece, ball) {
      return Math.abs(piece.position.x - ball.x) <= 1 && Math.abs(piece.position.y - ball.y) <= 1;
    }

    function calculateValidMoves(board, pieceId) {
      const piece = board.pieces.find(p => p.id === pieceId);
      if (!piece || piece.isStunned) return [];
      const def = getPieceDefinition(piece.typeId);
      const movesMap = new Map();

      const addMove = (tx, ty) => {
        if (!isInsideBoard(tx, ty)) return false;
        const occ = getPieceAt(board.pieces, tx, ty);
        if (!occ) {
          movesMap.set(`${tx},${ty}`, { x: tx, y: ty });
          return true;
        } else {
          if (occ.team !== piece.team) {
            movesMap.set(`${tx},${ty}`, { x: tx, y: ty });
          }
          return false;
        }
      };

      const { type, vectors } = def.moveRule;

      if (type === 'slide' || type === 'cannon') {
        vectors.forEach(v => {
          let step = 1;
          while (true) {
            const tx = piece.position.x + v.dx * step;
            const ty = piece.position.y + v.dy * step;
            const cont = addMove(tx, ty);
            if (!cont) break;
            step++;
          }
        });
      } else if (type === 'step') {
        vectors.forEach(v => {
          const maxR = v.maxRange || 1;
          for (let r = 1; r <= maxR; r++) {
            const tx = piece.position.x + v.dx * r;
            const ty = piece.position.y + v.dy * r;
            const cont = addMove(tx, ty);
            if (!cont) break;
          }
        });
      } else if (type === 'leap') {
        vectors.forEach(v => {
          const tx = piece.position.x + v.dx;
          const ty = piece.position.y + v.dy;
          addMove(tx, ty);
        });
      }

      // Universal 1-step in all 8 surrounding directions
      const ALL_SURROUNDING = [
        { dx: 0, dy: -1 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 1, dy: 0 },
        { dx: -1, dy: -1 }, { dx: 1, dy: -1 }, { dx: -1, dy: 1 }, { dx: 1, dy: 1 }
      ];
      ALL_SURROUNDING.forEach(v => {
        addMove(piece.position.x + v.dx, piece.position.y + v.dy);
      });

      return Array.from(movesMap.values());
    }

    function hasBall(piece, ball) {
      return piece.position.x === ball.x && piece.position.y === ball.y;
    }

    function calculateValidKicks(board, pieceId) {
      const piece = board.pieces.find(p => p.id === pieceId);
      if (!piece || !hasBall(piece, board.ballPosition)) return [];
      const def = getPieceDefinition(piece.typeId);
      const kicks = [];
      const { type, vectors } = def.kickRule;
      const ball = board.ballPosition;

      // King/GK special ability: can pass to any teammate anywhere on the field!
      if (piece.typeId === 'king' || def.role === 'GK') {
        board.pieces.forEach(p => {
          if (p.team === piece.team && p.id !== piece.id) {
            if (!kicks.some(k => k.x === p.position.x && k.y === p.position.y)) {
              kicks.push({ x: p.position.x, y: p.position.y });
            }
          }
        });
      }

      if (type === 'slide') {
        vectors.forEach(v => {
          let step = 1;
          while (true) {
            const tx = ball.x + v.dx * step;
            const ty = ball.y + v.dy * step;
            if (isGoalCell(tx, ty, piece.team, ball.x, ball.y)) { kicks.push({ x: tx, y: ty }); break; }
            if (!isInsideBoard(tx, ty)) break;
            const occ = getPieceAt(board.pieces, tx, ty);
            kicks.push({ x: tx, y: ty });
            if (occ) break;
            step++;
          }
        });
      } else if (type === 'step') {
        vectors.forEach(v => {
          const maxR = v.maxRange || 1;
          for (let r = 1; r <= maxR; r++) {
            const tx = ball.x + v.dx * r;
            const ty = ball.y + v.dy * r;
            if (isGoalCell(tx, ty, piece.team, ball.x, ball.y)) { kicks.push({ x: tx, y: ty }); break; }
            if (!isInsideBoard(tx, ty)) break;
            kicks.push({ x: tx, y: ty });
            if (getPieceAt(board.pieces, tx, ty)) break;
          }
        });
      } else if (type === 'leap') {
        vectors.forEach(v => {
          const tx = ball.x + v.dx;
          const ty = ball.y + v.dy;
          if (isGoalCell(tx, ty, piece.team, ball.x, ball.y) || isInsideBoard(tx, ty)) kicks.push({ x: tx, y: ty });
        });
      } else if (type === 'cannon') {
        vectors.forEach(v => {
          let step = 1;
          let count = 0;
          while (true) {
            const tx = ball.x + v.dx * step;
            const ty = ball.y + v.dy * step;
            if (!isInsideBoard(tx, ty) && !isGoalCell(tx, ty, piece.team, ball.x, ball.y)) break;
            const occ = getPieceAt(board.pieces, tx, ty);
            if (occ) {
              count++;
              if (count === 1) { step++; continue; }
              if (count > 1) { kicks.push({ x: tx, y: ty }); break; }
            }
            if (count === 1) kicks.push({ x: tx, y: ty });
            step++;
          }
        });
      }
      return kicks;
    }

    const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
    let mqttClient = null;
    let mqttClientId = '';
    let currentTopic = '';
    let isConnectedToPeer = false;
    let joinIntervalId = null;

    function App() {
      const [board, setBoard] = useState(createInitialBoard);
      const [goalAlert, setGoalAlert] = useState(null);
      const [setupTeam, setSetupTeam] = useState('white');
      const [placingTypeId, setPlacingTypeId] = useState(null);

      // Online Multiplayer states
      const [multiplayerMode, setMultiplayerMode] = useState('local');
      const [onlineRole, setOnlineRole] = useState(null);
      const [onlineRoomId, setOnlineRoomId] = useState(null);
      const [isOnlineModalOpen, setIsOnlineModalOpen] = useState(false);
      const [createdRoomCode, setCreatedRoomCode] = useState(null);
      const [joinCodeInput, setJoinCodeInput] = useState('');
      const [onlineStatusText, setOnlineStatusText] = useState('');
      const [floatingEmotes, setFloatingEmotes] = useState([]);
      const [copied, setCopied] = useState(false);

      const isSetupPhase = board.phase === 'setup';
      const selectedPiece = board.pieces.find(p => p.id === board.selectedPieceId);
      const isHoldingBall = selectedPiece ? hasBall(selectedPiece, board.ballPosition) : false;

      const currentTeamPieces = board.pieces.filter(p => p.team === setupTeam);
      const currentTeamCost = currentTeamPieces.reduce((sum, p) => sum + (getPieceDefinition(p.typeId)?.cost || 0), 0);
      const MAX_BUDGET = 150;

      const isMyTurnInOnline = multiplayerMode === 'local' || onlineRole === board.currentTurn;
      const isMyTeamInSetup = multiplayerMode === 'local' || onlineRole === setupTeam;

      // Keep latest board state accessible
      useEffect(() => {
        window.__STANDALONE_BOARD__ = board;
      }, [board]);

      const sendMqttPacket = (packet) => {
        if (mqttClient && mqttClient.connected && currentTopic) {
          mqttClient.publish(currentTopic, JSON.stringify(packet), { qos: 1 });
        }
      };

      const updateAndSyncBoard = (nextBoard) => {
        setBoard(nextBoard);
        window.__STANDALONE_BOARD__ = nextBoard;
        if (multiplayerMode === 'online') {
          sendMqttPacket({ type: 'SYNC_STATE', board: nextBoard, senderId: mqttClientId });
        }
      };

      const handleSendEmote = (emoji) => {
        const myTeam = onlineRole || board.currentTurn;
        const newEmote = { id: String(Date.now()), emoji, team: myTeam };
        setFloatingEmotes(prev => [...prev, newEmote]);
        setTimeout(() => {
          setFloatingEmotes(prev => prev.filter(e => e.id !== newEmote.id));
        }, 3000);

        if (multiplayerMode === 'online') {
          sendMqttPacket({ type: 'EMOTE', emoji, team: myTeam, senderId: mqttClientId });
        }
      };

      const cleanupMqtt = () => {
        if (joinIntervalId) {
          clearInterval(joinIntervalId);
          joinIntervalId = null;
        }
        if (mqttClient) {
          try {
            if (isConnectedToPeer && currentTopic) {
              sendMqttPacket({ type: 'LEAVE', senderId: mqttClientId });
            }
            mqttClient.end(true);
          } catch(e) {}
          mqttClient = null;
        }
        isConnectedToPeer = false;
        currentTopic = '';
      };

      const handleCreateOnlineRoom = () => {
        cleanupMqtt();
        setOnlineStatusText('Đang kết nối máy chủ đám mây EMQX...');
        const randomSuffix = Math.floor(100000 + Math.random() * 900000);
        const roomId = `cf-${randomSuffix}`;
        currentTopic = `chessfootball/v1/room/${roomId}`;
        mqttClientId = `host_${Math.random().toString(36).substring(2, 9)}`;

        const client = mqtt.connect(MQTT_BROKER, {
          clientId: mqttClientId,
          clean: true,
          connectTimeout: 8000,
        });

        client.on('connect', () => {
          mqttClient = client;
          client.subscribe(currentTopic, { qos: 1 }, (err) => {
            if (err) return setOnlineStatusText('Lỗi tạo phòng!');
            setCreatedRoomCode(roomId);
            setOnlineStatusText('🟢 Phòng đã sẵn sàng! Đang chờ đối thủ tham gia...');
          });
        });

        client.on('message', (_t, msg) => {
          try {
            const data = JSON.parse(msg.toString());
            if (data.senderId === mqttClientId) return;

            if (data.type === 'JOIN_REQUEST') {
              if (!isConnectedToPeer) {
                isConnectedToPeer = true;
                setMultiplayerMode('online');
                setOnlineRole('white');
                setOnlineRoomId(roomId);
                setIsOnlineModalOpen(false);
              }
              sendMqttPacket({
                type: 'JOIN_ACCEPT',
                hostId: mqttClientId,
                board: window.__STANDALONE_BOARD__ || board
              });
            } else if (data.type === 'SYNC_STATE') {
              setBoard(data.board);
            } else if (data.type === 'EMOTE') {
              const em = { id: String(Date.now()), emoji: data.emoji, team: data.team };
              setFloatingEmotes(prev => [...prev, em]);
              setTimeout(() => setFloatingEmotes(prev => prev.filter(e => e.id !== em.id)), 3000);
            } else if (data.type === 'LEAVE') {
              alert('Đối thủ đã rời khỏi phòng!');
              setMultiplayerMode('local');
              setOnlineRole(null);
              setOnlineRoomId(null);
            }
          } catch(e) {}
        });

        client.on('error', (err) => {
          setOnlineStatusText('Lỗi kết nối máy chủ: ' + err.message);
        });
      };

      const handleJoinOnlineRoom = () => {
        if (!joinCodeInput.trim()) return alert('Vui lòng nhập mã phòng!');
        cleanupMqtt();
        const cleanRoom = joinCodeInput.trim().toLowerCase();
        currentTopic = `chessfootball/v1/room/${cleanRoom}`;
        mqttClientId = `guest_${Math.random().toString(36).substring(2, 9)}`;
        setOnlineStatusText('Đang liên lạc với máy chủ và tìm chủ phòng...');

        const client = mqtt.connect(MQTT_BROKER, {
          clientId: mqttClientId,
          clean: true,
          connectTimeout: 8000,
        });

        client.on('connect', () => {
          mqttClient = client;
          client.subscribe(currentTopic, { qos: 1 }, (err) => {
            if (err) return setOnlineStatusText('Lỗi vào phòng!');

            const sendReq = () => {
              sendMqttPacket({ type: 'JOIN_REQUEST', senderId: mqttClientId });
            };
            sendReq();
            joinIntervalId = setInterval(sendReq, 1000);
          });
        });

        client.on('message', (_t, msg) => {
          try {
            const data = JSON.parse(msg.toString());
            if (data.senderId === mqttClientId) return;

            if (data.type === 'JOIN_ACCEPT') {
              if (joinIntervalId) {
                clearInterval(joinIntervalId);
                joinIntervalId = null;
              }
              if (!isConnectedToPeer) {
                isConnectedToPeer = true;
                setMultiplayerMode('online');
                setOnlineRole('black');
                setOnlineRoomId(cleanRoom);
                setIsOnlineModalOpen(false);
                if (data.board) {
                  setBoard(data.board);
                }
              }
            } else if (data.type === 'SYNC_STATE') {
              setBoard(data.board);
            } else if (data.type === 'EMOTE') {
              const em = { id: String(Date.now()), emoji: data.emoji, team: data.team };
              setFloatingEmotes(prev => [...prev, em]);
              setTimeout(() => setFloatingEmotes(prev => prev.filter(e => e.id !== em.id)), 3000);
            } else if (data.type === 'LEAVE') {
              alert('Chủ phòng đã rời khỏi phòng đấu!');
              setMultiplayerMode('local');
              setOnlineRole(null);
              setOnlineRoomId(null);
            }
          } catch(e) {}
        });

        client.on('error', (err) => {
          setOnlineStatusText('Lỗi kết nối: ' + err.message);
        });
      };

      let validTargets = [];
      if (isSetupPhase) {
        if (selectedPiece && selectedPiece.team === setupTeam && isMyTeamInSetup) {
          const isWhite = setupTeam === 'white';
          const minY = isWhite ? 8 : 1;
          const maxY = isWhite ? 13 : 6;
          for (let y = minY; y <= maxY; y++) {
            for (let x = 0; x <= 10; x++) {
              validTargets.push({ x, y });
            }
          }
        }
      } else {
        if (selectedPiece && isMyTurnInOnline) {
          if (board.activeAction === 'move') {
            validTargets = calculateValidMoves(board, selectedPiece.id);
          } else if (board.activeAction === 'kick') {
            validTargets = calculateValidKicks(board, selectedPiece.id);
          }
        }
      }

      const isValid = (x, y) => validTargets.some(t => t.x === x && t.y === y);

      const handleCellClick = (x, y) => {
        if (isSetupPhase) {
          if (!isMyTeamInSetup) return;
          const isWhite = setupTeam === 'white';
          const isInHalf = isWhite ? y >= 8 && y <= 13 : y >= 1 && y <= 6;
          if (!isInHalf) return;

          const existingPiece = board.pieces.find(p => p.position.x === x && p.position.y === y);

          if (placingTypeId) {
            if (existingPiece) return;
            const def = getPieceDefinition(placingTypeId);
            if (currentTeamPieces.length >= 11) {
              alert('Đội hình đã đủ 11 cầu thủ!');
              return;
            }
            if (currentTeamCost + def.cost > MAX_BUDGET) {
              alert(`Vượt quá quỹ lương! (Tối đa ${MAX_BUDGET}đ)`);
              return;
            }
            const newPiece = {
              id: `p_${Date.now()}_${Math.random()}`,
              typeId: placingTypeId,
              team: setupTeam,
              position: { x, y },
              formationIndex: currentTeamPieces.length
            };
            updateAndSyncBoard({ ...board, pieces: [...board.pieces, newPiece] });
            setPlacingTypeId(null);
            return;
          }

          if (existingPiece) {
            if (existingPiece.team !== setupTeam) {
              setSetupTeam(existingPiece.team);
              setBoard({ ...board, selectedPieceId: existingPiece.id });
              return;
            }
            if (selectedPiece && selectedPiece.id !== existingPiece.id && selectedPiece.team === setupTeam) {
              // Swap
              const p1 = { ...selectedPiece.position };
              const p2 = { ...existingPiece.position };
              updateAndSyncBoard({
                ...board,
                pieces: board.pieces.map(p => {
                  if (p.id === selectedPiece.id) return { ...p, position: p2 };
                  if (p.id === existingPiece.id) return { ...p, position: p1 };
                  return p;
                }),
                selectedPieceId: null
              });
              return;
            }
            setBoard({ ...board, selectedPieceId: board.selectedPieceId === existingPiece.id ? null : existingPiece.id });
            return;
          }

          if (selectedPiece && selectedPiece.team === setupTeam) {
            updateAndSyncBoard({
              ...board,
              pieces: board.pieces.map(p => p.id === selectedPiece.id ? { ...p, position: { x, y } } : p),
              selectedPieceId: null
            });
          }
          return;
        }

        // PLAYING PHASE
        if (board.winner || !isMyTurnInOnline) return;

        const clickedPiece = board.pieces.find(p => p.position.x === x && p.position.y === y);
        const isTarget = isValid(x, y);

        if (clickedPiece && clickedPiece.team === board.currentTurn && !isTarget) {
          const holdsBall = hasBall(clickedPiece, board.ballPosition);
          setBoard({ ...board, selectedPieceId: clickedPiece.id, activeAction: holdsBall ? 'kick' : 'move' });
          return;
        }

        if (!selectedPiece || !board.activeAction) {
          if (clickedPiece && clickedPiece.team === board.currentTurn) {
            const holdsBall = hasBall(clickedPiece, board.ballPosition);
            setBoard({ ...board, selectedPieceId: clickedPiece.id, activeAction: holdsBall ? 'kick' : 'move' });
          }
          return;
        }

        if (!isTarget) {
          if (clickedPiece && clickedPiece.team === board.currentTurn) {
            const holdsBall = hasBall(clickedPiece, board.ballPosition);
            setBoard({ ...board, selectedPieceId: clickedPiece.id, activeAction: holdsBall ? 'kick' : 'move' });
          } else {
            setBoard({ ...board, selectedPieceId: null, activeAction: null });
          }
          return;
        }

        if (board.activeAction === 'move') {
          const isCarryingBall = selectedPiece.position.x === board.ballPosition.x && selectedPiece.position.y === board.ballPosition.y;
          const isGoal = isCarryingBall && isGoalCell(x, y, selectedPiece.team);

          if (isGoal) {
            const newScore = { ...board.score, [selectedPiece.team]: board.score[selectedPiece.team] + 1 };
            setGoalAlert({ team: selectedPiece.team, name: getPieceDefinition(selectedPiece.typeId).vietnameseName });
            setTimeout(() => setGoalAlert(null), 3000);

            const resetPieces = (board.savedFormation || board.pieces).map(p => ({ ...p, position: { ...p.position }, isStunned: false, abilityCooldown: 0 }));
            const concedingTeam = selectedPiece.team === 'white' ? 'black' : 'white';

            updateAndSyncBoard({
              ...board,
              pieces: resetPieces,
              ballPosition: { x: 5, y: 7 },
              remainingAP: 2,
              currentTurn: concedingTeam,
              score: newScore,
              selectedPieceId: null,
              activeAction: null,
              winner: newScore[selectedPiece.team] >= 2 ? selectedPiece.team : null,
              commentary: [{ id: String(Date.now()), text: `⚽ VÀOOOOOO! [${selectedPiece.team === 'white' ? 'Đội Trắng' : 'Đội Đỏ'}] ${getPieceDefinition(selectedPiece.typeId).vietnameseName} solo dẫn bóng dắt bóng thẳng vào lưới!`, timestamp: 'GOAL' }, ...board.commentary]
            });
            return;
          }

          const newPieces = board.pieces.map(p => ({ ...p, position: { ...p.position } }));
          const pIdx = newPieces.findIndex(p => p.id === selectedPiece.id);
          const oppIdx = newPieces.findIndex(p => p.position.x === x && p.position.y === y && p.team !== selectedPiece.team);

          let isBallSteal = false;

          if (oppIdx !== -1) {
            const opp = newPieces[oppIdx];
            isBallSteal = (opp.position.x === board.ballPosition.x && opp.position.y === board.ballPosition.y);
            const dx = Math.sign(opp.position.x - selectedPiece.position.x) || 0;
            const dy = Math.sign(opp.position.y - selectedPiece.position.y) || 1;
            
            const isAvail = (nx, ny) => {
              if (!isInsideBoard(nx, ny)) return false;
              if (nx === x && ny === y) return false;
              const occ = newPieces.find(p => p.position.x === nx && p.position.y === ny && p.id !== opp.id);
              if (!occ || occ.id === selectedPiece.id) return true;
              return false;
            };

            let pushed = false;
            if (isAvail(opp.position.x + dx, opp.position.y + dy)) {
              opp.position = { x: opp.position.x + dx, y: opp.position.y + dy };
              pushed = true;
            } else {
              const neighbors = [
                { x: opp.position.x + dx, y: opp.position.y },
                { x: opp.position.x, y: opp.position.y + dy },
                { x: opp.position.x + 1, y: opp.position.y },
                { x: opp.position.x - 1, y: opp.position.y },
                { x: opp.position.x, y: opp.position.y + 1 },
                { x: opp.position.x - 1, y: opp.position.y - 1 },
                { x: opp.position.x + 1, y: opp.position.y + 1 },
                { x: opp.position.x - 1, y: opp.position.y - 1 },
                { x: selectedPiece.position.x, y: selectedPiece.position.y }
              ];
              const cell = neighbors.find(n => isAvail(n.x, n.y));
              if (cell) {
                opp.position = { x: cell.x, y: cell.y };
                pushed = true;
              } else {
                opp.position = { x: selectedPiece.position.x, y: selectedPiece.position.y };
              }
            }
            opp.isStunned = true;
          }

          const isCollectingBall = !isCarryingBall && board.ballPosition.x === x && board.ballPosition.y === y;
          const isBulldozeReady = isCarryingBall && oppIdx !== -1 && Boolean(getPieceDefinition(selectedPiece.typeId).hasBulldozer) && (!selectedPiece.abilityCooldown || selectedPiece.abilityCooldown === 0);
          const isBulldozeOnCooldown = isCarryingBall && oppIdx !== -1 && Boolean(getPieceDefinition(selectedPiece.typeId).hasBulldozer) && Boolean(selectedPiece.abilityCooldown && selectedPiece.abilityCooldown > 0);
          const isBulldoze = isBulldozeReady;

          newPieces[pIdx].position = { x, y };
          if (isBulldoze) {
            newPieces[pIdx].abilityCooldown = 1;
          }

          let isTurnOver = false;
          let remainingAP = board.remainingAP;

          if (isCollectingBall || isBallSteal || isBulldoze) {
            isTurnOver = false;
            remainingAP = board.remainingAP;
          } else {
            const nextAP = board.remainingAP - 1;
            isTurnOver = nextAP <= 0;
            remainingAP = isTurnOver ? 2 : nextAP;
          }

          const nextTurn = isTurnOver ? (board.currentTurn === 'white' ? 'black' : 'white') : board.currentTurn;

          if (isTurnOver) {
            newPieces.forEach(p => {
              if (p.team === board.currentTurn && p.abilityCooldown && p.abilityCooldown > 0) {
                p.abilityCooldown -= 1;
              }
              if (p.team === nextTurn) p.isStunned = false;
            });
          }

          updateAndSyncBoard({
            ...board,
            pieces: newPieces,
            ballPosition: isCarryingBall ? { x, y } : board.ballPosition,
            remainingAP,
            currentTurn: nextTurn,
            selectedPieceId: null,
            activeAction: null,
            commentary: [{ id: String(Date.now()), text: isBulldoze ? `🦬 [${selectedPiece.team === 'white' ? 'Trắng' : 'Đỏ'}] ${getPieceDefinition(selectedPiece.typeId).vietnameseName} kích hoạt [SỰ TRÂU BÒ]! Húc văng đối thủ ra xa mà không mất lượt! (Bắt đầu hồi chiêu: 1 lượt)` : isBulldozeOnCooldown ? `⚔️ [${selectedPiece.team === 'white' ? 'Trắng' : 'Đỏ'}] ${getPieceDefinition(selectedPiece.typeId).vietnameseName} dẫn bóng tì đè đối thủ ([SỰ TRÂU BÒ] đang hồi chiêu!)` : isBallSteal ? `⚡ [${selectedPiece.team === 'white' ? 'Trắng' : 'Đỏ'}] ${getPieceDefinition(selectedPiece.typeId).vietnameseName} cướp bóng thành công! (Giữ lượt!)` : isCollectingBall ? `⚡ [${selectedPiece.team === 'white' ? 'Trắng' : 'Đỏ'}] ${getPieceDefinition(selectedPiece.typeId).vietnameseName} đã khống chế bóng thành công! (Lấy bóng - Thêm 1 lượt!)` : isCarryingBall ? `⚔️ [${selectedPiece.team === 'white' ? 'Trắng' : 'Đỏ'}] ${getPieceDefinition(selectedPiece.typeId).vietnameseName} dẫn bóng tì đè đối thủ tới (${x}, ${y})` : `🏃 [${selectedPiece.team === 'white' ? 'Trắng' : 'Đỏ'}] ${getPieceDefinition(selectedPiece.typeId).vietnameseName} di chuyển tới (${x}, ${y})`, timestamp: 'Min' }, ...board.commentary]
          });
        } else if (board.activeAction === 'kick') {
          const isGoal = isGoalCell(x, y, selectedPiece.team);
          if (isGoal) {
            const newScore = { ...board.score, [selectedPiece.team]: board.score[selectedPiece.team] + 1 };
            setGoalAlert({ team: selectedPiece.team, name: getPieceDefinition(selectedPiece.typeId).vietnameseName });
            setTimeout(() => setGoalAlert(null), 3000);

            const resetPieces = (board.savedFormation || board.pieces).map(p => ({ ...p, position: { ...p.position }, isStunned: false, abilityCooldown: 0 }));
            const concedingTeam = selectedPiece.team === 'white' ? 'black' : 'white';

            updateAndSyncBoard({
              ...board,
              pieces: resetPieces,
              ballPosition: { x: 5, y: 7 },
              remainingAP: 2,
              currentTurn: concedingTeam,
              score: newScore,
              selectedPieceId: null,
              activeAction: null,
              winner: newScore[selectedPiece.team] >= 2 ? selectedPiece.team : null,
              commentary: [{ id: String(Date.now()), text: `⚽ VÀOOOOOO! Bàn thắng tuyệt đẹp cho ${selectedPiece.team === 'white' ? 'Đội Trắng' : 'Đội Đỏ'}!`, timestamp: 'GOAL' }, ...board.commentary]
            });
            return;
          }

          const newPieces = board.pieces.map(p => ({ ...p, position: { ...p.position } }));
          const receiver = getPieceAt(newPieces, x, y);
          const isPassToTeammate = Boolean(receiver && receiver.team === selectedPiece.team);
          const isPassToOpponent = Boolean(receiver && receiver.team !== selectedPiece.team);

          let isTurnOver = false;
          let remainingAP = board.remainingAP;

          if (isPassToTeammate) {
            isTurnOver = false;
            remainingAP = board.remainingAP;
          } else if (isPassToOpponent) {
            isTurnOver = true;
            remainingAP = 2;
          } else {
            const nextAP = board.remainingAP - 1;
            isTurnOver = nextAP <= 0;
            remainingAP = isTurnOver ? 2 : nextAP;
          }

          const nextTurn = isTurnOver ? (board.currentTurn === 'white' ? 'black' : 'white') : board.currentTurn;

          if (isTurnOver) {
            newPieces.forEach(p => {
              if (p.team === board.currentTurn && p.abilityCooldown && p.abilityCooldown > 0) {
                p.abilityCooldown -= 1;
              }
              if (p.team === nextTurn) p.isStunned = false;
            });
          }

          updateAndSyncBoard({
            ...board,
            pieces: newPieces,
            ballPosition: { x, y },
            remainingAP,
            currentTurn: nextTurn,
            selectedPieceId: null,
            activeAction: null,
            commentary: [{ id: String(Date.now()), text: isPassToTeammate ? `🎯 [${selectedPiece.team === 'white' ? 'Trắng' : 'Đỏ'}] ${getPieceDefinition(selectedPiece.typeId).vietnameseName} chuyền bóng chuẩn xác cho đồng đội! (Giữ lượt!)` : isPassToOpponent ? `😱 [${selectedPiece.team === 'white' ? 'Trắng' : 'Đỏ'}] ${getPieceDefinition(selectedPiece.typeId).vietnameseName} chuyền bóng thẳng vào chân đối phương! (Mất lượt!)` : `⚽ [${selectedPiece.team === 'white' ? 'Trắng' : 'Đỏ'}] ${getPieceDefinition(selectedPiece.typeId).vietnameseName} sút bóng tới (${x}, ${y})`, timestamp: 'Min' }, ...board.commentary]
          });
        }
      };

      const handleDeletePiece = (pieceId) => {
        if (!isMyTeamInSetup) return;
        const p = board.pieces.find(pc => pc.id === pieceId);
        if (!p) return;
        if (p.typeId === 'king') {
          const kingCount = board.pieces.filter(pc => pc.team === p.team && pc.typeId === 'king').length;
          if (kingCount <= 1) {
            alert('Mỗi đội bắt buộc phải có ít nhất 1 Thủ Môn (Vua)!');
            return;
          }
        }
        updateAndSyncBoard({ ...board, pieces: board.pieces.filter(pc => pc.id !== pieceId), selectedPieceId: null });
      };

      const handleApplyPreset = (preset) => {
        if (!isMyTeamInSetup) return;
        const isWhite = setupTeam === 'white';
        let positions = [];
        if (preset === '4-4-2') {
          positions = isWhite
            ? [{ x: 5, y: 13 }, { x: 1, y: 11 }, { x: 3, y: 11 }, { x: 7, y: 11 }, { x: 9, y: 11 }, { x: 1, y: 9 }, { x: 4, y: 9 }, { x: 6, y: 9 }, { x: 9, y: 9 }, { x: 4, y: 8 }, { x: 6, y: 8 }]
            : [{ x: 5, y: 1 }, { x: 1, y: 3 }, { x: 3, y: 3 }, { x: 7, y: 3 }, { x: 9, y: 3 }, { x: 1, y: 5 }, { x: 4, y: 5 }, { x: 6, y: 5 }, { x: 9, y: 5 }, { x: 4, y: 6 }, { x: 6, y: 6 }];
        } else if (preset === '4-3-3') {
          positions = isWhite
            ? [{ x: 5, y: 13 }, { x: 1, y: 11 }, { x: 3, y: 11 }, { x: 7, y: 11 }, { x: 9, y: 11 }, { x: 2, y: 9 }, { x: 5, y: 9 }, { x: 8, y: 9 }, { x: 2, y: 8 }, { x: 5, y: 8 }, { x: 8, y: 8 }]
            : [{ x: 5, y: 1 }, { x: 1, y: 3 }, { x: 3, y: 3 }, { x: 7, y: 3 }, { x: 9, y: 3 }, { x: 2, y: 5 }, { x: 5, y: 5 }, { x: 8, y: 5 }, { x: 2, y: 6 }, { x: 5, y: 6 }, { x: 8, y: 6 }];
        } else if (preset === '3-5-2') {
          positions = isWhite
            ? [{ x: 5, y: 13 }, { x: 3, y: 11 }, { x: 5, y: 11 }, { x: 7, y: 11 }, { x: 1, y: 9 }, { x: 3, y: 9 }, { x: 5, y: 9 }, { x: 7, y: 9 }, { x: 9, y: 9 }, { x: 4, y: 8 }, { x: 6, y: 8 }]
            : [{ x: 5, y: 1 }, { x: 3, y: 3 }, { x: 5, y: 3 }, { x: 7, y: 3 }, { x: 1, y: 5 }, { x: 3, y: 5 }, { x: 5, y: 5 }, { x: 7, y: 5 }, { x: 9, y: 5 }, { x: 4, y: 6 }, { x: 6, y: 6 }];
        }
        const other = board.pieces.filter(p => p.team !== setupTeam);
        const updated = currentTeamPieces.map((p, idx) => ({ ...p, position: positions[idx] || p.position }));
        updateAndSyncBoard({ ...board, pieces: [...other, ...updated], selectedPieceId: null });
      };

      const handleStartMatch = () => {
        const whitePieces = board.pieces.filter(p => p.team === 'white');
        const blackPieces = board.pieces.filter(p => p.team === 'black');
        if (whitePieces.length < 5 || blackPieces.length < 5) {
          alert('Mỗi đội cần có tối thiểu 5 cầu thủ!');
          return;
        }

        const savedFormation = board.pieces.map(p => ({
          ...p,
          position: { ...p.position },
          isStunned: false,
          abilityCooldown: 0,
        }));

        updateAndSyncBoard({
          ...board,
          phase: 'playing',
          savedFormation,
          pieces: savedFormation,
          currentTurn: 'white',
          remainingAP: 2,
          selectedPieceId: null,
          activeAction: null,
          commentary: [{ id: `c_${Date.now()}`, text: '🔔 Trọng tài đã nổi còi bắt đầu trận đấu! Đội Trắng giao bóng (2 lượt/vòng).', type: 'whistle', timestamp: '00:00' }, ...board.commentary]
        });
      };

      return (
        <div className="max-w-7xl mx-auto py-6 px-4 flex flex-col items-center relative">
          {/* Floating Emote Display Overlay */}
          {floatingEmotes.map((e) => (
            <div
              key={e.id}
              className="fixed top-24 z-50 animate-bounce text-6xl drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] pointer-events-none"
              style={{
                left: e.team === 'white' ? '25%' : '75%',
              }}
            >
              {e.emoji}
            </div>
          ))}

          {/* Top Global Multiplayer Bar */}
          <div className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-2.5 mb-3 flex flex-wrap items-center justify-between gap-2 shadow-lg">
            <div className="flex items-center gap-2">
              <span className="text-sm">🌐</span>
              <span className="text-xs font-bold text-slate-300">Chế độ:</span>
              {multiplayerMode === 'online' ? (
                <span className="text-xs bg-emerald-950 text-emerald-400 font-black px-2.5 py-0.5 rounded-full border border-emerald-700 flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping" />
                  <span>ĐÁ ONLINE (Phòng: {onlineRoomId})</span>
                </span>
              ) : (
                <span className="text-xs bg-slate-800 text-slate-300 font-bold px-2.5 py-0.5 rounded-full border border-slate-700">
                  Chơi Cùng Máy (Local 2P)
                </span>
              )}

              {multiplayerMode === 'online' && (
                <span className="text-xs bg-slate-900 text-amber-300 font-extrabold px-2.5 py-0.5 rounded-full border border-amber-500/40">
                  Bạn là: Đội {onlineRole === 'white' ? 'Trắng ♔' : 'Đỏ ♚'}
                </span>
              )}
            </div>

            {/* Emote Quick Bar & Online Lobby Button */}
            <div className="flex items-center gap-2">
              <div className="flex items-center gap-1 bg-slate-900 px-2 py-0.5 rounded-xl border border-slate-800">
                <span className="text-[10px] text-slate-400 mr-1 hidden sm:inline">Thả Emote:</span>
                {['⚽', '🔥', '😱', '👏', '🏆', '🤣'].map((emoji) => (
                  <button
                    key={emoji}
                    onClick={() => handleSendEmote(emoji)}
                    className="hover:scale-125 transition-transform text-sm px-1 py-0.5"
                  >
                    {emoji}
                  </button>
                ))}
              </div>

              {multiplayerMode === 'online' ? (
                <button
                  onClick={() => {
                    if (window.confirm('Bạn có muốn thoát khỏi phòng Online này không?')) {
                      if (peerInstance) peerInstance.destroy();
                      setMultiplayerMode('local');
                      setOnlineRole(null);
                      setOnlineRoomId(null);
                    }
                  }}
                  className="px-3 py-1 bg-red-600/30 hover:bg-red-600 text-red-300 hover:text-white text-xs font-bold rounded-xl border border-red-500/50"
                >
                  🚪 Rời Phòng
                </button>
              ) : (
                <button
                  onClick={() => setIsOnlineModalOpen(true)}
                  className="px-3.5 py-1 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 text-slate-950 font-black text-xs rounded-xl shadow-md uppercase tracking-wider flex items-center gap-1"
                >
                  <span>🌐</span> Đá Online P2P
                </button>
              )}
            </div>
          </div>
          {/* Header & Scoreboard / Mode */}
          <div className="w-full bg-slate-900 border-2 border-slate-700 rounded-3xl p-5 mb-6 shadow-2xl flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="text-3xl text-amber-400">♔</span>
              <div>
                <div className="flex items-center gap-2">
                  <h3 className="font-extrabold text-white text-lg">Đội Trắng</h3>
                  {isSetupPhase && (
                    <button
                      onClick={() => setSetupTeam('white')}
                      className={`text-xs px-2.5 py-0.5 rounded-full font-bold border transition-all ${setupTeam === 'white' ? 'bg-amber-400 text-black border-amber-300 ring-2 ring-amber-400' : 'bg-slate-800 text-slate-300 border-slate-700'}`}
                    >
                      🛠️ Đang xếp
                    </button>
                  )}
                </div>
                <p className="text-xs text-slate-400">Tấn công Khung thành Đỏ (ở trên)</p>
              </div>
            </div>

            <div className="text-center">
              {isSetupPhase ? (
                <div className="flex flex-col items-center gap-2">
                  <div className="bg-amber-500/20 border-2 border-amber-400/80 px-6 py-1.5 rounded-2xl shadow-lg">
                    <span className="text-sm font-black text-amber-300 uppercase tracking-wider">
                      🛠️ BỐ TRÍ CHIẾN THUẬT TIỀN TRẬN
                    </span>
                  </div>
                  <button
                    onClick={handleStartMatch}
                    className="px-6 py-2 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 text-slate-950 font-black text-sm rounded-xl shadow-xl uppercase tracking-wider animate-bounce flex items-center gap-2"
                  >
                    <span>🟢 BẮT ĐẦU TRẬN ĐẤU</span>
                  </button>
                </div>
              ) : (
                <div>
                  <div className="bg-black/90 px-8 py-2 rounded-2xl border-2 border-yellow-500 shadow-[0_0_20px_rgba(234,179,8,0.3)] inline-flex items-center justify-center gap-3 min-w-[160px]">
                    <span className="w-12 text-center text-4xl font-black text-amber-400 font-mono">{board.score.white}</span>
                    <span className="text-2xl text-slate-500 font-bold">:</span>
                    <span className="w-12 text-center text-4xl font-black text-red-500 font-mono">{board.score.black}</span>
                  </div>
                  <div className="mt-2 flex items-center justify-center gap-2">
                    <span className={`px-3 py-0.5 rounded-full text-xs font-black uppercase ${board.currentTurn === 'white' ? 'bg-amber-400 text-black' : 'bg-red-600 text-white'}`}>
                      LƯỢT: {board.currentTurn === 'white' ? 'TRẮNG' : 'ĐỎ'}
                    </span>
                    <span className="text-xs bg-slate-950 px-2.5 py-0.5 rounded-full text-amber-400 font-black border border-slate-700 flex items-center gap-1 animate-pulse">
                      <span>⚡ Còn {board.remainingAP}/2 Lượt</span>
                    </span>
                  </div>
                </div>
              )}
            </div>

            <div className="flex items-center gap-3">
              <div className="text-right">
                <div className="flex items-center justify-end gap-2">
                  {isSetupPhase && (
                    <button
                      onClick={() => setSetupTeam('black')}
                      className={`text-xs px-2.5 py-0.5 rounded-full font-bold border transition-all ${setupTeam === 'black' ? 'bg-red-600 text-white border-red-400 ring-2 ring-red-500' : 'bg-slate-800 text-slate-300 border-slate-700'}`}
                    >
                      🛠️ Đang xếp
                    </button>
                  )}
                  <h3 className="font-extrabold text-white text-lg">Đội Đỏ</h3>
                </div>
                <p className="text-xs text-slate-400">Tấn công Khung thành Trắng (ở dưới)</p>
              </div>
              <span className="text-3xl text-red-500">♚</span>
            </div>
          </div>

          {/* Stadium & Controls */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 w-full items-start">
            {/* Controls */}
            <div className="lg:col-span-3 bg-slate-900 border border-slate-700 rounded-2xl p-4 shadow-xl">
              {isSetupPhase ? (
                /* SETUP MODE PANEL */
                <div className="flex flex-col gap-3">
                  <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                    <h4 className="text-xs font-black uppercase text-amber-400">🛠️ XẾP ĐỘI HÌNH</h4>
                    <div className="flex gap-1">
                      <button
                        onClick={() => setSetupTeam('white')}
                        className={`px-2 py-0.5 rounded text-xs font-bold ${setupTeam === 'white' ? 'bg-amber-400 text-black' : 'bg-slate-800 text-slate-300'}`}
                      >
                        Trắng
                      </button>
                      <button
                        onClick={() => setSetupTeam('black')}
                        className={`px-2 py-0.5 rounded text-xs font-bold ${setupTeam === 'black' ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-300'}`}
                      >
                        Đỏ
                      </button>
                    </div>
                  </div>

                  <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex justify-between">
                    <div>
                      <span className="text-[10px] text-slate-400">💰 Quỹ Lương:</span>
                      <p className="text-sm font-black text-amber-400">{currentTeamCost} / {MAX_BUDGET}đ</p>
                    </div>
                    <div className="text-right">
                      <span className="text-[10px] text-slate-400">👥 Cầu thủ:</span>
                      <p className="text-sm font-black text-cyan-400">{currentTeamPieces.length} / 11</p>
                    </div>
                  </div>

                  <div>
                    <span className="text-[10px] font-bold text-slate-400 uppercase">⚡ Đội hình mẫu:</span>
                    <div className="grid grid-cols-3 gap-1 mt-1">
                      <button onClick={() => handleApplyPreset('4-4-2')} className="py-1 bg-slate-800 text-xs font-bold rounded border border-slate-700">4-4-2</button>
                      <button onClick={() => handleApplyPreset('4-3-3')} className="py-1 bg-slate-800 text-xs font-bold rounded border border-slate-700">4-3-3</button>
                      <button onClick={() => handleApplyPreset('3-5-2')} className="py-1 bg-slate-800 text-xs font-bold rounded border border-slate-700">3-5-2</button>
                    </div>
                  </div>

                  <div>
                    <span className="text-[10px] font-bold text-slate-400 uppercase">➕ Thêm quân cờ:</span>
                    <div className="grid grid-cols-2 gap-1.5 mt-1 max-h-40 overflow-y-auto">
                      {Object.values(PIECE_REGISTRY).map(def => {
                        const isPlacing = placingTypeId === def.id;
                        const canAfford = currentTeamCost + def.cost <= MAX_BUDGET && currentTeamPieces.length < 11;
                        return (
                          <button
                            key={def.id}
                            disabled={!canAfford && !isPlacing}
                            onClick={() => {
                              setPlacingTypeId(isPlacing ? null : def.id);
                              setBoard({ ...board, selectedPieceId: null });
                            }}
                            className={`p-1.5 rounded-lg border text-left flex items-center gap-1.5 ${isPlacing ? 'bg-cyan-500 text-black border-cyan-300' : !canAfford ? 'opacity-40 bg-slate-900 cursor-not-allowed' : 'bg-slate-800 hover:bg-slate-700'}`}
                          >
                            <span className="text-lg">{def.symbol}</span>
                            <div>
                              <p className="text-[10px] font-bold">{def.vietnameseName.split(' ')[0]}</p>
                              <span className="text-[9px] text-amber-300">{def.cost}đ</span>
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {selectedPiece && selectedPiece.team === setupTeam && (
                    <div className="bg-slate-950 p-2.5 rounded-xl border border-amber-500/40">
                      <div className="flex justify-between items-center mb-1">
                        <div className="flex items-center gap-2">
                          <span className="text-xl">{getPieceDefinition(selectedPiece.typeId).symbol}</span>
                          <span className="text-xs font-bold">{getPieceDefinition(selectedPiece.typeId).vietnameseName}</span>
                        </div>
                        <button
                          onClick={() => handleDeletePiece(selectedPiece.id)}
                          className="px-2 py-0.5 bg-red-600/40 hover:bg-red-600 text-xs font-bold rounded border border-red-500"
                        >
                          🗑️ Xóa
                        </button>
                      </div>
                      <p className="text-[9px] text-amber-300">👉 Nhấp ô trống để di chuyển, hoặc nhấp cầu thủ khác để đổi chỗ!</p>
                    </div>
                  )}

                  <button
                    onClick={handleStartMatch}
                    className="w-full py-2.5 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 text-slate-950 font-black text-xs rounded-xl uppercase tracking-wider"
                  >
                    🟢 Bắt Đầu Trận Đấu
                  </button>
                </div>
              ) : (
                /* PLAYING MODE PANEL */
                <div>
                  <h4 className="text-xs font-bold text-amber-400 uppercase tracking-wider mb-3">🎮 Điều Khiển</h4>
                  {selectedPiece ? (
                    <div>
                      <div className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 mb-3 shadow-inner">
                        <div className="flex items-center gap-3">
                          <span className="text-3xl">{getPieceDefinition(selectedPiece.typeId).symbol}</span>
                          <div className="flex-1">
                            <div className="flex items-center justify-between">
                              <span className="text-sm font-black text-white">{getPieceDefinition(selectedPiece.typeId).vietnameseName}</span>
                              <span className="text-[10px] bg-cyan-950 text-cyan-400 font-bold px-2 py-0.5 rounded-full border border-cyan-800/60 uppercase">
                                {getPieceDefinition(selectedPiece.typeId).role}
                              </span>
                            </div>
                            <p className="text-[10px] text-slate-400 font-medium">
                              Vị trí: ({selectedPiece.position.x}, {selectedPiece.position.y})
                            </p>
                          </div>
                        </div>

                        {getPieceDefinition(selectedPiece.typeId).specialAbilityDesc && (
                          <div className="mt-2.5 bg-gradient-to-r from-amber-950/50 to-slate-900 border border-amber-500/40 rounded-xl p-2">
                            <div className="flex items-center justify-between gap-1 text-[11px] font-black text-amber-300">
                              <div className="flex items-center gap-1">
                                <span>✨ KỸ NĂNG:</span>
                                {getPieceDefinition(selectedPiece.typeId).hasBulldozer && (
                                  <span className="text-[9px] bg-red-500/30 text-amber-200 px-1.5 py-0.2 rounded border border-amber-500/50 font-bold">
                                    🦬 TRÂU BÒ
                                  </span>
                                )}
                              </div>
                              {getPieceDefinition(selectedPiece.typeId).hasBulldozer && (
                                selectedPiece.abilityCooldown && selectedPiece.abilityCooldown > 0 ? (
                                  <span className="text-[9px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/40 font-bold animate-pulse">
                                    ⏳ Hồi: {selectedPiece.abilityCooldown} lượt
                                  </span>
                                ) : (
                                  <span className="text-[9px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-500/40 font-bold">
                                    ⚡ SẴN SÀNG
                                  </span>
                                )
                              )}
                            </div>
                            <p className="text-[11px] text-amber-100/90 mt-0.5 font-medium leading-relaxed">
                              {getPieceDefinition(selectedPiece.typeId).specialAbilityDesc}
                            </p>
                          </div>
                        )}
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={() => setBoard({ ...board, activeAction: 'move' })}
                          className={`py-2 px-3 rounded-xl text-xs font-bold ${board.activeAction === 'move' ? 'bg-cyan-400 text-black' : 'bg-slate-800 text-slate-200'}`}
                        >
                          🏃 Di Chuyển
                        </button>
                        <button
                          disabled={!isHoldingBall}
                          onClick={() => setBoard({ ...board, activeAction: 'kick' })}
                          className={`py-2 px-3 rounded-xl text-xs font-bold ${!isHoldingBall ? 'opacity-40 bg-slate-800' : board.activeAction === 'kick' ? 'bg-amber-400 text-black' : 'bg-slate-800 text-amber-300'}`}
                        >
                          ⚽ Sút / Chuyền
                        </button>
                      </div>
                    </div>
                  ) : (
                    <p className="text-xs text-slate-400 text-center py-4">Nhấp vào một quân cờ của bạn trên sân</p>
                  )}

                  <button
                    onClick={() => {
                      const nextTurn = board.currentTurn === 'white' ? 'black' : 'white';
                      const newPieces = board.pieces.map(p => {
                        let cd = p.abilityCooldown;
                        if (p.team === board.currentTurn && cd && cd > 0) cd -= 1;
                        return { ...p, isStunned: p.team === nextTurn ? false : p.isStunned, abilityCooldown: cd };
                      });
                      setBoard({
                        ...board,
                        pieces: newPieces,
                        currentTurn: nextTurn,
                        remainingAP: 2,
                        selectedPieceId: null,
                        activeAction: null,
                        commentary: [{ id: String(Date.now()), text: `⏱️ Kết thúc lượt. Quyền điều khiển chuyển sang [${nextTurn === 'white' ? 'Trắng' : 'Đỏ'}].`, timestamp: 'Min' }, ...board.commentary]
                      });
                    }}
                    className="w-full mt-4 py-2 bg-amber-600 hover:bg-amber-500 text-black font-black text-xs rounded-xl uppercase"
                  >
                    ⏱️ Kết Thúc Lượt (Đổi bên)
                  </button>

                  <button
                    onClick={() => setBoard({ ...board, phase: 'setup' })}
                    className="w-full mt-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs font-bold rounded-xl border border-amber-500/30"
                  >
                    ⚙️ Xếp Lại Đội Hình
                  </button>
                </div>
              )}
            </div>

            {/* Stadium Pitch */}
            <div className="lg:col-span-6 flex flex-col items-center">
              <div className="bg-emerald-800 p-2 rounded-2xl border-4 border-slate-700 shadow-2xl">
                <div
                  className="grid gap-[2px] bg-emerald-950 p-2 rounded-xl"
                  style={{
                    gridTemplateColumns: `repeat(${BOARD_WIDTH}, minmax(0, 1fr))`,
                    gridTemplateRows: `repeat(${BOARD_HEIGHT}, minmax(0, 1fr))`,
                    width: 'min(92vw, 560px)',
                    height: 'min(135vw, 760px)'
                  }}
                >
                  {Array.from({ length: BOARD_HEIGHT }).map((_, y) =>
                    Array.from({ length: BOARD_WIDTH }).map((__, x) => {
                      const piece = getPieceAt(board.pieces, x, y);
                      const isBall = board.ballPosition.x === x && board.ballPosition.y === y;
                      const target = isValid(x, y);
                      const isSelected = selectedPiece?.position.x === x && selectedPiece?.position.y === y;

                      const isGoalArea = (y === 0 || y === 14) && x >= 4 && x <= 6;
                      const isOutOfPitch = (y === 0 || y === 14) && (x < 4 || x > 6);
                      const isInActiveZone = isSetupPhase && (setupTeam === 'white' ? y >= 8 && y <= 13 : y >= 1 && y <= 6) && !isOutOfPitch;

                      let bg = (x + y) % 2 === 0 ? 'bg-emerald-700' : 'bg-emerald-600';
                      if (isGoalArea) bg = 'bg-yellow-950 border-2 border-yellow-400';
                      else if (isOutOfPitch) bg = 'opacity-0 pointer-events-none';
                      else if (isInActiveZone) bg += ' ring-1 ring-amber-400/30';

                      const handleSquareClick = () => {
                        if (isOutOfPitch) return;
                        handleCellClick(x, y);
                      };

                      return (
                        <div
                          key={`${x}-${y}`}
                          onClick={handleSquareClick}
                          className={`relative flex items-center justify-center rounded transition-all ${bg} ${isOutOfPitch ? 'pointer-events-none' : 'cursor-pointer'} ${isSelected ? 'ring-2 ring-yellow-400 scale-105 z-20' : ''}`}
                        >
                          {target && (
                            <div className="absolute inset-0 flex items-center justify-center z-30 pointer-events-none">
                              <div className="w-6 h-6 rounded-full bg-cyan-400/50 border-2 border-cyan-200 animate-pulse flex items-center justify-center text-xs">
                                {board.activeAction === 'kick' ? '⚽' : '●'}
                              </div>
                            </div>
                          )}

                          {piece && (
                            <div className={`relative flex flex-col items-center justify-center z-10 select-none ${piece.isStunned ? 'opacity-50 grayscale' : ''}`}>
                              <span className={`text-xl md:text-2xl font-black drop-shadow-md ${piece.team === 'white' ? 'text-amber-100' : 'text-red-500'}`}>
                                {getPieceDefinition(piece.typeId).symbol}
                              </span>
                              <span className={`text-[8px] font-bold px-1 rounded -mt-1 ${piece.team === 'white' ? 'bg-amber-400 text-black' : 'bg-red-600 text-white'}`}>
                                {getPieceDefinition(piece.typeId).vietnameseName.slice(0, 3)}
                              </span>
                            </div>
                          )}

                          {isBall && (
                            <div className="absolute z-20 w-4 h-4 rounded-full bg-yellow-300 border border-slate-950 flex items-center justify-center shadow-lg animate-bounce pointer-events-none">
                              ⚽
                            </div>
                          )}
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            </div>

            {/* Commentary Feed */}
            <div className="lg:col-span-3 bg-slate-900 border border-slate-700 rounded-2xl p-4 shadow-xl h-[400px] flex flex-col">
              <h4 className="text-xs font-bold text-cyan-400 uppercase tracking-wider mb-2">🎙️ Tường Thuật Trực Tiếp</h4>
              <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                {board.commentary.map(log => (
                  <div key={log.id} className="p-2 bg-slate-950 rounded-xl text-xs border border-slate-800 text-slate-300">
                    {log.text}
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Goal Banner */}
          {goalAlert && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm">
              <div className="text-center p-8 bg-slate-900 border-4 border-yellow-400 rounded-3xl shadow-2xl">
                <div className="text-7xl mb-2">⚽</div>
                <h1 className="text-5xl font-black text-yellow-400 uppercase">VÀOOOOOO!</h1>
                <p className="text-lg text-white mt-2">Bàn thắng bởi: <strong className="text-yellow-300">{goalAlert.name}</strong></p>
              </div>
            </div>
          )}
          {/* Online Lobby Modal */}
          {isOnlineModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
              <div className="bg-slate-900 border-2 border-cyan-500/80 rounded-3xl p-6 max-w-md w-full shadow-2xl relative">
                <button
                  onClick={() => setIsOnlineModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-lg w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center"
                >
                  ✕
                </button>

                <div className="flex items-center gap-3 mb-6">
                  <div className="w-12 h-12 rounded-2xl bg-cyan-500/20 border-2 border-cyan-400 flex items-center justify-center text-2xl shadow-lg">
                    🌐
                  </div>
                  <div>
                    <h3 className="text-xl font-black text-white">Đá Online (P2P Real-time)</h3>
                    <p className="text-xs text-slate-400">Thi đấu trực tiếp giữa 2 thiết bị không cần server</p>
                  </div>
                </div>

                <div className="flex flex-col gap-4">
                  {!createdRoomCode ? (
                    <div className="flex flex-col gap-3">
                      <button
                        onClick={handleCreateOnlineRoom}
                        className="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 text-slate-950 font-black text-sm rounded-xl shadow-xl uppercase tracking-wider flex items-center justify-center gap-2"
                      >
                        <span>🏠</span> Tạo Phòng Mới (Bạn là Đội Trắng)
                      </button>

                      <div className="relative flex py-2 items-center">
                        <div className="flex-grow border-t border-slate-700"></div>
                        <span className="flex-shrink mx-4 text-slate-500 text-xs uppercase font-bold">Hoặc</span>
                        <div className="flex-grow border-t border-slate-700"></div>
                      </div>

                      <div className="flex flex-col gap-2">
                        <input
                          type="text"
                          placeholder="Nhập mã phòng (VD: cf-123456)"
                          value={joinCodeInput}
                          onChange={(e) => setJoinCodeInput(e.target.value)}
                          className="w-full bg-slate-950 border-2 border-slate-700 focus:border-amber-400 rounded-xl px-4 py-2.5 text-center font-mono font-bold text-white outline-none"
                        />
                        <button
                          onClick={handleJoinOnlineRoom}
                          className="w-full py-2.5 bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-black text-sm rounded-xl shadow-xl uppercase tracking-wider"
                        >
                          🔑 Vào Phòng (Bạn là Đội Đỏ)
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="bg-slate-950 p-4 rounded-2xl border border-cyan-500/40 text-center flex flex-col items-center gap-3">
                      <span className="text-[11px] font-bold text-cyan-400 uppercase tracking-wider">
                        MÃ PHÒNG THI ĐẤU CỦA BẠN:
                      </span>
                      <div className="bg-slate-900 border-2 border-dashed border-cyan-400 px-6 py-2 rounded-xl text-2xl font-mono font-black text-amber-400 tracking-widest shadow-inner">
                        {createdRoomCode}
                      </div>

                      <div className="flex gap-2 w-full mt-2">
                        <button
                          onClick={() => {
                            const url = `${window.location.origin}${window.location.pathname}?room=${createdRoomCode}`;
                            navigator.clipboard.writeText(url);
                            setCopied(true);
                            setTimeout(() => setCopied(false), 2000);
                          }}
                          className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 rounded-xl border border-slate-700"
                        >
                          {copied ? '✅ Đã chép Link!' : '🔗 Chép Link mời'}
                        </button>
                      </div>

                      <div className="flex items-center gap-2 mt-2 text-xs text-amber-300 font-medium animate-pulse">
                        <span>⏳</span> Đang chờ đối thủ kết nối vào phòng...
                      </div>
                    </div>
                  )}

                  {onlineStatusText && (
                    <p className="text-center text-xs mt-2 text-cyan-300 font-medium bg-cyan-950/40 p-2 rounded-xl border border-cyan-800/40">
                      {onlineStatusText}
                    </p>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
